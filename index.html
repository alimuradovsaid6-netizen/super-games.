<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Taktik Nişan Oyunu - Pro Sürüm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        html, body { width: 100%; height: 100%; background: #060913; color: #f8fafc; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .game-wrapper { position: relative; width: 920px; height: 560px; max-width: 100vw; max-height: 100vh; background: #1e293b; border: 3px solid #334155; border-radius: 12px; padding: 10px; box-shadow: 0 25px 50px rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; }
        
        #canvasContainer { width: 100%; height: 100%; border-radius: 8px; overflow: hidden; position: relative; background: #020617; }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        
        .hud { display: flex; justify-content: space-between; width: 100%; padding: 5px 10px; font-size: 1.1rem; font-weight: bold; color: #4ade80; margin-bottom: 5px; }
        .controls-hint { margin-top: 8px; font-size: 0.85rem; color: #cbd5e1; background: #0f172a; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; width: 100%; text-align: center; }

        .crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: rgba(0, 255, 128, 0.9); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; border: 2px solid #fff; display: none; z-index: 5; }
        .click-to-play { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.94); color: #38bdf8; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.7rem; font-weight: bold; cursor: pointer; border-radius: 8px; z-index: 10; text-align: center; padding: 20px; }
        
        .top-bar { display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 5px; padding: 0 5px; }
        h1 { color: #38bdf8; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 1px; }
        .btn-fullscreen { background: #334155; border: none; color: #94a3b8; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.85rem; }
        .btn-fullscreen:hover { background: #475569; color: #fff; }
    </style>
</head>
<body>

    <div class="game-wrapper" id="gameWrapper">
        <div class="top-bar">
            <h1>🎯 3D TAKTİK SİLAH OYUNU</h1>
            <button class="btn-fullscreen" onclick="toggleFullscreen()">🖥️ Tam Ekran</button>
        </div>

        <div class="hud">
            <div>Vurulan Düşman: <span id="score">0</span></div>
            <div>Can: <span id="health" style="color:#ef4444;">100</span></div>
        </div>

        <div id="canvasContainer">
            <div id="gameOverlay" class="click-to-play" onclick="startGame()">
                ▶ OYNAMAK İÇİN TIKLA
                <span style="font-size:0.95rem; color:#94a3b8; margin-top:12px; font-weight:normal;">
                    W,A,S,D: Yürü | SPACE: Zıpla | Fare: Nişan | Sol Tık: Ateş Et
                </span>
            </div>
            <div class="crosshair" id="gameCrosshair"></div>
        </div>

        <div class="controls-hint">⌨️ <b>Kontroller:</b> W,A,S,D (Yürüme) | SPACE (Zıpla) | Sol Tık (Ateş Et) | ESC (Fareyi Serbest Bırak)</div>
    </div>

    <script>
        let scene, camera, renderer;
        let walls = [], bots = [];
        let score = 0, health = 100;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocityY = 0, canJump = false;
        let raycaster, mouse;
        let gunGroup;

        const container = document.getElementById('canvasContainer');

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060913);
            scene.fog = new THREE.FogExp2(0x060913, 0.022);

            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Işıklandırma
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // Zemin
            const floorGeo = new THREE.PlaneGeometry(90, 90);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Çarpışmalı Duvarlar (Labirent Engelleri)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4 });
            const wallPositions = [
                {x: -10, z: -10, w: 16, d: 2}, {x: 12, z: 12, w: 2, d: 16},
                {x: -16, z: 12, w: 14, d: 2}, {x: 14, z: -14, w: 2, d: 15},
                {x: 0, z: -22, w: 22, d: 2},  {x: -22, z: 0, w: 2, d: 22},
                {x: 8, z: 0, w: 2, d: 10},     {x: -8, z: -8, w: 10, d: 2}
            ];

            wallPositions.forEach(pos => {
                const wallGeo = new THREE.BoxGeometry(pos.w, 4, pos.d);
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(pos.x, 2, pos.z);
                scene.add(wall);
                walls.push(wall);
            });

            // --- DETAYLI 3D SİLAH VE GÖRÜNÜR MAĞAZA (ŞARJÖR) + İÇİNDEKİ MÜHİMMAT ---
            gunGroup = new THREE.Group();
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.9, roughness: 0.15 });
            
            // Silah Gövdesi
            const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.16, 0.85), gunMat);
            bodyMesh.position.set(0.25, -0.22, -0.5);
            gunGroup.add(bodyMesh);

            // Namlu
            const barrelMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.45), gunMat);
            barrelMesh.rotation.x = Math.PI / 2;
            barrelMesh.position.set(0.25, -0.20, -0.95);
            gunGroup.add(barrelMesh);

            // BELİRGİN ŞARJÖR (MAĞAZA)
            const magMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.7, roughness: 0.3 });
            const magazine = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.16), magMat);
            magazine.position.set(0.25, -0.40, -0.42);
            magazine.rotation.x = 0.15;
            gunGroup.add(magazine);

            // ŞARJÖRÜN İÇİNDEKİ GÖRÜNÜR KURŞUNLAR (PUL/MERMİ UÇLARI)
            const bulletMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, roughness: 0.1 }); // Altın sarısı mermiler
            for(let i = 0; i < 3; i++) {
                const bulletTip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.04), bulletMat);
                bulletTip.position.set(0.25, -0.27 - (i * 0.07), -0.38);
                gunGroup.add(bulletTip);
            }

            // Arpacık / Nişangah
            const sightMesh = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, 0.04), gunMat);
            sightMesh.position.set(0.25, -0.12, -0.85);
            gunGroup.add(sightMesh);

            camera.add(gunGroup);
            scene.add(camera);

            // Botları Oluştur
            for (let i = 0; i < 7; i++) {
                spawnBot();
            }

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2(0, 0);

            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            renderer.domElement.addEventListener('click', shootGun);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function startGame() {
            document.getElementById('gameOverlay').style.display = 'none';
            document.getElementById('gameCrosshair').style.display = 'block';
            renderer.domElement.requestPointerLock();
        }

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== renderer?.domElement) {
                document.getElementById('gameOverlay').style.display = 'flex';
                document.getElementById('gameCrosshair').style.display = 'none';
            }
        });

        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        document.addEventListener('mousemove', (event) => {
            if (document.pointerLockElement === renderer?.domElement) {
                const movementX = event.movementX || event.mozMovementX || 0;
                const movementY = event.movementY || event.mozMovementY || 0;

                euler.setFromQuaternion(camera.quaternion);
                euler.y -= movementX * 0.0025;
                euler.x -= movementY * 0.0025;
                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                camera.quaternion.setFromEuler(euler);
            }
        });

        function onKeyDown(e) {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
            if (e.code === 'Space' && canJump) {
                velocityY = 0.15;
                canJump = false;
            }
        }

        function onKeyUp(e) {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        }

        function spawnBot() {
            const botGroup = new THREE.Group();
            
            // Bot Gövdesi
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), bodyMat);
            body.position.y = 0.6;
            botGroup.add(body);

            // Bot Kafası
            const headMat = new THREE.MeshStandardMaterial({ color: 0xf87171 });
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), headMat);
            head.position.y = 1.45;
            botGroup.add(head);

            // Rastgele konum (duvarların içine doğmasın diye basit döngü)
            let posX, posZ, safe = false;
            while(!safe) {
                posX = (Math.random() - 0.5) * 60;
                posZ = (Math.random() - 0.5) * 60;
                const testPos = new THREE.Vector3(posX, 1.6, posZ);
                if (!checkCollision(testPos)) safe = true;
            }

            botGroup.position.set(posX, 0, posZ);
            scene.add(botGroup);
            bots.push(botGroup);
        }

        function checkCollision(pos) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(0.8, 1.8, 0.8));
            for (let wall of walls) {
                const wallBox = new THREE.Box3().setFromObject(wall);
                if (playerBox.intersectsBox(wallBox)) return true;
            }
            return false;
        }

        function shootGun() {
            if (document.pointerLockElement !== renderer.domElement) return;

            // Ateş Etme Geri Tepme Efekti
            gunGroup.position.z += 0.08;
            setTimeout(() => gunGroup.position.z -= 0.08, 70);

            raycaster.setFromCamera(mouse, camera);
            const botMeshes = bots.map(b => b.children[0]);
            const intersects = raycaster.intersectObjects(botMeshes);

            if (intersects.length > 0) {
                const hitBody = intersects[0].object;
                const hitBot = bots.find(b => b.children[0] === hitBody);
                if (hitBot) {
                    scene.remove(hitBot);
                    bots = bots.filter(b => b !== hitBot);
                    score++;
                    document.getElementById('score').innerText = score;
                    spawnBot();
                }
            }
        }

        function toggleFullscreen() {
            let elem = document.getElementById("gameWrapper");
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => alert(`Tam ekran hatası: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.11;
            let dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();
            let sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

            let nextPos = camera.position.clone();

            if (moveForward) nextPos.addScaledVector(dir, speed);
            if (moveBackward) nextPos.addScaledVector(dir, -speed);
            if (moveRight) nextPos.addScaledVector(sideDir, speed);
            if (moveLeft) nextPos.addScaledVector(sideDir, -speed);

            // Duvar Çarpışma Kontrolü (İçinden geçemez)
            if (!checkCollision(nextPos)) {
                camera.position.x = nextPos.x;
                camera.position.z = nextPos.z;
            }

            // Yerçekimi ve Zıplama (Space)
            velocityY -= 0.007;
            camera.position.y += velocityY;
            if (camera.position.y <= 1.6) {
                camera.position.y = 1.6;
                velocityY = 0;
                canJump = true;
            }

            // Harita Sınırları
            camera.position.x = Math.max(-42, Math.min(42, camera.position.x));
            camera.position.z = Math.max(-42, Math.min(42, camera.position.z));

            // Botların Hareketi ve Oyuncuyu Takibi
            bots.forEach(bot => {
                const bDir = new THREE.Vector3().subVectors(camera.position, bot.position);
                bDir.y = 0;
                bDir.normalize();
                
                let nextBotPos = bot.position.clone().addScaledVector(bDir, 0.02);
                
                // Botların da duvar içinden geçmesini engelle
                const botBox = new THREE.Box3().setFromCenterAndSize(nextBotPos.clone().setY(1), new THREE.Vector3(0.8, 1.5, 0.8));
                let botCollides = false;
                for (let wall of walls) {
                    if (botBox.intersectsBox(new THREE.Box3().setFromObject(wall))) {
                        botCollides = true;
                        break;
                    }
                }

                if (!botCollides) {
                    bot.position.copy(nextBotPos);
                }
                
                bot.lookAt(camera.position.x, bot.position.y, camera.position.z);

                // Oyuncuya Hasar Verme
                if (bot.position.distanceTo(camera.position) < 1.4) {
                    health -= 0.3;
                    document.getElementById('health').innerText = Math.max(0, Math.floor(health));
                    if (health <= 0) {
                        alert('Oyun Bitti! Toplam Skorun: ' + score);
                        health = 100;
                        score = 0;
                        document.getElementById('score').innerText = score;
                        camera.position.set(0, 1.6, 12);
                    }
                }
            });

            renderer.render(scene, camera);
        }

        initGame();
    </script>
</body>
</html>
